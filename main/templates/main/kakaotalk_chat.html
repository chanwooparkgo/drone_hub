<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>드론 모임 링크</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <style>

        body {
            background-color: #f8f9fa;
        }

        .main-banner {
            background-color: #212529;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .main-banner h1 {
            font-size: 45px;
            font-weight: bold;
        }
        .mian-banner p {
            margin-top: 15px;
            font-size: 18px;
        }

        /* 오픈채팅방 카드 부분 */
        .meeting-section {
            min-height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 오픈채팅방 카드 */
        .meeting-card {
            width: 100%;
            max-width: 600px;
            transition: 0.3s;
        }

        .meeting-card:hover {
            transform: translateY(-5px);
        }
        .meeting-card .card-body {
            text-align: center;
            padding: 40px;
        }
        .meeting-card .card-title {
            font-weight: bold;
            margin-bottom: 20px;
        }
        .meeting-card .card-text {
            line-height: 1.8;
            margin-bottom: 25px;
        }

    </style>

</head>


<body>


    <!-- 네비게이션 바 -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="/">
                드론 정보
            </a>


            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbarNav">

                <div class="navbar-nav ms-auto">

                    <a class="nav-link" href="/">
                        홈
                    </a>

                    <a class="nav-link" href="/flight_tap">
                        비행 지도
                    </a>

                    <a class="nav-link" href="#">
                        장소 공유
                    </a>

                    <a class="nav-link" href="#">
                        중고거래
                    </a>

                    <a class="nav-link active" href="/drone_meeting">
                        커뮤니티
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- 메인 배너 -->

    <section class="main-banner">

        <h1>드론 모임 링크</h1>

        <p>
            함께 드론을 즐길 수 있는 모임을 찾아보세요.
        </p>

    </section>



    <!-- 모임 링크 -->

<div class="meeting-section">

    <div class="card shadow-sm meeting-card">

        <div class="card-body">

            <h3 class="card-title">
                드론 정보 광장(정보&사진공유방)
            </h3>

            <p class="card-text">
                이곳은 드론을 좋아하는 사람들끼리<br>
                자유롭게 의견 공유하며 노는 방입니다.
            </p>

            <a href="https://open.kakao.com/o/gxiUyqQg"
               target="_blank"
               class="btn btn-warning">

                오픈채팅방 입장

            </a>

        </div>

    </div>

</div>




    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>


</body>

</html>
